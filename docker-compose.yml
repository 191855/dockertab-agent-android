services:
  dockertab-agent-android:
    image: ghcr.io/191855/dockertab-agent-android:latest
    container_name: dockertab-agent-android
    restart: unless-stopped
    ports:
      - "8378:8378"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dockertab-config:/root/.config/dockertab
    environment:
      - DOCKERTAB_HOST=${DOCKERTAB_HOST}
      - DOCKERTAB_NAME=${DOCKERTAB_NAME:-DockerTab}
      - DOCKERTAB_PORT=8378
volumes:
  dockertab-config:
